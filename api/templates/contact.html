{% extends 'base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}
<div class="page">
    <div class="page-center">
        <span class="eyebrow">Get in touch</span>
        <h1 class="page-title">Contact</h1>
        <p class="page-sub">Send a message — for this demo, it is shown on the page (not emailed yet).</p>

        <div class="glass-card">
            {% if success %}
                <div class="success">
                    Thanks, <strong>{{ name }}</strong>! We received your message.
                </div>
            {% endif %}

            <form method="post" action="/contact/">
                {% csrf_token %}

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required
                           value="{{ request.POST.name }}" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required
                           value="{{ request.POST.email }}" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" required
                              placeholder="How can we help?">{{ request.POST.message }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Send message</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
