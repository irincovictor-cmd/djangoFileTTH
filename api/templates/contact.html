{% extends 'base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}
<div class="page">
    <div class="page-center">
        <span class="eyebrow">Get in touch</span>
        <h1 class="page-title">Contact</h1>
        <p class="page-sub">Leave your details so we can reach you.</p>

        <div class="glass-card">
            {% if success %}
                <div class="success">
                    Thanks, <strong>{{ name }}</strong>! We received your contact details.
                </div>
            {% endif %}

            <form method="post" action="/contact/">
                {% csrf_token %}

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required
                           value="{{ request.POST.name }}" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required
                           value="{{ request.POST.email }}" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="contact_number">Contact number</label>
                    <input type="tel" id="contact_number" name="contact_number" required
                           value="{{ request.POST.contact_number }}"
                           placeholder="e.g. 09XX XXX XXXX"
                           inputmode="tel"
                           autocomplete="tel">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
