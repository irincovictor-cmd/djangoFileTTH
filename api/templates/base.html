<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LearnHub{% endblock %} | Educational Site</title>
    <style>
        :root {
            --primary: #1a56db;
            --primary-dark: #1e429f;
            --accent: #0e9f6e;
            --bg: #f8fafc;
            --text: #1e293b;
            --muted: #64748b;
            --card: #ffffff;
            --line: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- NAVBAR ---------- */
        .navbar {
            background: var(--card);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.9rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
            text-decoration: none;
        }

        .logo span { color: var(--accent); }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 0.25rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--muted);
            font-weight: 500;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            transition: 0.15s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
            background: #eff6ff;
        }

        /* ---------- BUTTONS / CTA ---------- */
        .btn {
            display: inline-block;
            padding: 0.75rem 1.4rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.15s;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover { background: var(--primary-dark); }

        .btn-ghost {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-ghost:hover {
            background: #eff6ff;
        }

        /* ---------- LAYOUT ---------- */
        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
        }

        .page-title {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .page-sub {
            color: var(--muted);
            margin-bottom: 2rem;
        }

        /* ---------- HERO (Home CTA) ---------- */
        .hero {
            display: grid;
            gap: 2rem;
            align-items: center;
            padding: 2rem 0 3rem;
        }

        @media (min-width: 768px) {
            .hero { grid-template-columns: 1.2fr 1fr; }
        }

        .hero h1 {
            font-size: clamp(2rem, 4vw, 2.75rem);
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .hero h1 em {
            font-style: normal;
            color: var(--primary);
        }

        .hero p {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            max-width: 36ch;
        }

        .cta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .hero-card {
            background: linear-gradient(145deg, #1a56db, #0e9f6e);
            color: #fff;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 12px 40px rgba(26, 86, 219, 0.25);
        }

        .hero-card h3 { margin-bottom: 0.75rem; }
        .hero-card ul {
            list-style: none;
            display: grid;
            gap: 0.5rem;
        }
        .hero-card li::before {
            content: "✓ ";
            font-weight: 700;
        }

        /* ---------- CARDS / TOPICS ---------- */
        .grid {
            display: grid;
            gap: 1.25rem;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 1.5rem;
            transition: 0.15s;
        }

        .card:hover {
            border-color: #bfdbfe;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        .card .tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            background: #eff6ff;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            margin-bottom: 0.75rem;
        }

        .card h3 { margin-bottom: 0.4rem; font-size: 1.15rem; }
        .card p { color: var(--muted); font-size: 0.95rem; }

        /* ---------- ABOUT / CONTACT ---------- */
        .content-box {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 1.75rem;
            max-width: 640px;
        }

        .content-box p { margin-bottom: 1rem; color: var(--muted); }

        .form-group { margin-bottom: 1rem; }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        /* ---------- FOOTER ---------- */
        footer {
            border-top: 1px solid var(--line);
            background: var(--card);
            padding: 1.5rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- NAVBAR: Home | Topics | About Us | Contact -->
    <header class="navbar">
        <div class="nav-inner">
            <a href="{% url 'home' %}" class="logo">Learn<span>Hub</span></a>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a></li>
                <li><a href="{% url 'topics' %}" class="{% if request.resolver_match.url_name == 'topics' %}active{% endif %}">Topics</a></li>
                <li><a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">About Us</a></li>
                <li><a href="{% url 'contact' %}" class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact</a></li>
            </ul>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 LearnHub — Built with Django for learning.</p>
    </footer>

</body>
</html>
