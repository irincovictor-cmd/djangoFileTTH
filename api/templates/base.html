<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LearnHub{% endblock %} | Educational Site</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --accent: #34d399;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --card: rgba(255, 255, 255, 0.92);
            --card-text: #0f172a;
            --line: rgba(255, 255, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            /* Contrasting background so white/glass cards stand out */
            background:
                radial-gradient(ellipse at 20% 20%, #1e3a5f 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, #0f766e 0%, transparent 45%),
                linear-gradient(160deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.9rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: #fff;
            text-decoration: none;
        }

        .logo span { color: var(--accent); }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 0.25rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--muted);
            font-weight: 500;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            transition: 0.15s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
            background: rgba(59, 130, 246, 0.25);
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.4rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.15s;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover { background: var(--primary-dark); }

        .btn-ghost {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }

        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
        }

        /* Center About / Contact content */
        .page-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .page-center .page-title,
        .page-center .page-sub {
            text-align: center;
        }

        .page-title {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .page-sub {
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .hero {
            display: grid;
            gap: 2rem;
            align-items: center;
            padding: 2rem 0 3rem;
        }

        @media (min-width: 768px) {
            .hero { grid-template-columns: 1.2fr 1fr; }
        }

        .hero h1 {
            font-size: clamp(2rem, 4vw, 2.75rem);
            line-height: 1.2;
            margin-bottom: 1rem;
            color: #fff;
        }

        .hero h1 em {
            font-style: normal;
            color: var(--accent);
        }

        .hero p {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            max-width: 36ch;
        }

        .cta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .hero-card {
            background: linear-gradient(145deg, #1d4ed8, #059669);
            color: #fff;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .hero-card h3 { margin-bottom: 0.75rem; }
        .hero-card ul {
            list-style: none;
            display: grid;
            gap: 0.5rem;
            text-align: left;
        }
        .hero-card li::before {
            content: "✓ ";
            font-weight: 700;
        }

        .grid {
            display: grid;
            gap: 1.25rem;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }

        .card {
            background: var(--card);
            color: var(--card-text);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 14px;
            padding: 1.5rem;
            transition: 0.15s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }

        .card .tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-dark);
            background: #dbeafe;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            margin-bottom: 0.75rem;
        }

        .card h3 { margin-bottom: 0.4rem; font-size: 1.15rem; }
        .card p { color: #475569; font-size: 0.95rem; }

        /* Solid content box (About) */
        .content-box {
            background: var(--card);
            color: var(--card-text);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 16px;
            padding: 1.75rem;
            max-width: 640px;
            width: 100%;
            text-align: left;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        }

        .content-box p { margin-bottom: 1rem; color: #475569; }
        .content-box strong { color: var(--card-text); }

        /* Glassmorphism card (Contact form) */
        .glass-card {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-align: left;
        }

        .glass-card label {
            color: #e2e8f0;
        }

        .glass-card input,
        .glass-card textarea {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }

        .glass-card input::placeholder,
        .glass-card textarea::placeholder {
            color: rgba(226, 232, 240, 0.55);
        }

        .glass-card input:focus,
        .glass-card textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
        }

        .form-group { margin-bottom: 1rem; }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .success {
            background: rgba(16, 185, 129, 0.2);
            color: #a7f3d0;
            border: 1px solid rgba(52, 211, 153, 0.4);
            padding: 0.85rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .actions-row {
            margin-top: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        footer {
            border-top: 1px solid var(--line);
            background: rgba(15, 23, 42, 0.8);
            padding: 1.5rem 1.25rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-inner">
            <a href="/" class="logo">Learn<span>Hub</span></a>
            <ul class="nav-links">
                <li>
                    <a href="/"
                       class="{% if request.path == '/' or request.path == '/home/' %}active{% endif %}">
                        Home
                    </a>
                </li>
                <li>
                    <a href="/topics/"
                       class="{% if '/topics' in request.path %}active{% endif %}">
                        Topics
                    </a>
                </li>
                <li>
                    <a href="/about/"
                       class="{% if '/about' in request.path %}active{% endif %}">
                        About Us
                    </a>
                </li>
                <li>
                    <a href="/contact/"
                       class="{% if '/contact' in request.path %}active{% endif %}">
                        Contact
                    </a>
                </li>
            </ul>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 LearnHub — Built with Django for learning.</p>
    </footer>

</body>
</html>
