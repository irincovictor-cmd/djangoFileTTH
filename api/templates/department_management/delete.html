{% extends 'department_management/base.html' %}

{% block title %}Remove department{% endblock %}

{% block content %}
<div class="form-wrap">
  <h1>Remove department?</h1>
  <p class="lede">
    This will permanently delete
    <strong style="color: var(--text);">{{ department.name }}</strong>
    (<code style="color: var(--accent);">{{ department.code }}</code>).
  </p>

  <div class="panel">
    <form method="post">
      {% csrf_token %}
      <div class="form-actions">
        <button type="submit" class="btn btn-danger-solid">Yes, remove</button>
        <a href="{% url 'department_list' %}" class="btn btn-ghost">Keep it</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
