<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Departments{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222d;
      --surface-2: #243040;
      --border: #2e3a4a;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9cf0;
      --accent-dim: rgba(61, 156, 240, 0.15);
      --danger: #f07178;
      --ok: #7fd99a;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
    }
    .shell { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }
    .brand span { color: var(--accent); }
    .top-links { display: flex; gap: 1rem; flex-wrap: wrap; }
    .top-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .top-links a:hover { color: var(--accent); }
    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }
    .lede { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.15rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-accent {
      background: var(--accent);
      color: #0a1018;
    }
    .btn-accent:hover { background: #5aaff5; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-danger-solid {
      background: var(--danger);
      color: #1a0a0c;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.4rem;
      margin-top: 1.25rem;
    }
    .flash {
      background: var(--accent-dim);
      border: 1px solid rgba(61, 156, 240, 0.35);
      color: var(--ok);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }
    .flash-error {
      color: var(--danger);
      border-color: rgba(240, 113, 120, 0.4);
      background: rgba(240, 113, 120, 0.1);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .toolbar input[type="text"] {
      flex: 1;
      min-width: 180px;
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
    }
    .toolbar input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    td code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      color: var(--accent);
    }
    .row-actions { display: flex; gap: 0.65rem; flex-wrap: wrap; }
    .row-actions a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .row-actions a.danger { color: var(--danger); }
    .row-actions a:hover { text-decoration: underline; }
    .form-wrap { max-width: 440px; }
    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .form-control {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .form-control::placeholder { color: #5a6a7a; }
    .field-error { color: var(--danger); font-size: 0.82rem; margin-top: 0.3rem; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.5rem; }
    .detail-grid { display: grid; gap: 0; }
    .detail-item {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 0.75rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .detail-item .k {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    @media (max-width: 560px) {
      .detail-item { grid-template-columns: 1fr; gap: 0.2rem; }
      th:nth-child(4), td:nth-child(4),
      th:nth-child(5), td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a href="{% url 'department_list' %}" class="brand">Dept<span>.</span>Hub</a>
      <nav class="top-links">
        <a href="{% url 'department_list' %}">Departments</a>
        <a href="{% url 'home' %}">LearnHub</a>
        <a href="/admin/">Admin</a>
      </nav>
    </header>

    {% if messages %}
      {% for message in messages %}
      <div class="flash {% if message.tags == 'error' %}flash-error{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
