{% extends 'base.html' %}

{% block title %}{{ topic.title }}{% endblock %}

{% block content %}
<div class="page-center">
    <p class="page-sub" style="margin-bottom: 0.5rem;">
        <a href="/topics/" style="color: #94a3b8;">&larr; Back to topics</a>
    </p>

    <h1 class="page-title">{{ topic.title }}</h1>
    <p class="page-sub">
        <span class="tag" style="background:#dbeafe;color:#1e40af;padding:0.2rem 0.55rem;border-radius:999px;font-size:0.75rem;font-weight:600;">
            {{ topic.tag }}
        </span>
    </p>

    <div class="content-box">
        <p style="margin-bottom: 0; white-space: pre-line;">{{ topic.body }}</p>
    </div>

    <div class="actions-row">
        <a href="/topics/" class="btn btn-primary">All topics</a>
        <a href="/contact/" class="btn btn-ghost">Ask a question</a>
    </div>
</div>
{% endblock %}
