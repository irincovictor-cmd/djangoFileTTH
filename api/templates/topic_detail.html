{% extends 'base.html' %}

{% block title %}{{ topic.title }}{% endblock %}

{% block content %}
<div class="page">
    <div class="page-center">
        <p class="page-sub" style="margin-bottom: 0.5rem;">
            <a href="/topics/" style="color: var(--ink-soft); text-decoration: none;">&larr; Back to topics</a>
        </p>

        <span class="eyebrow">{{ topic.tag }}</span>
        <h1 class="page-title">{{ topic.title }}</h1>

        <div class="content-box" style="margin-top: 0.5rem;">
            <p style="white-space: pre-line;">{{ topic.body }}</p>
        </div>

        <div class="actions-row">
            <a href="/topics/" class="btn btn-primary">All topics</a>
            <a href="/contact/" class="btn btn-ghost">Ask a question</a>
        </div>
    </div>
</div>
{% endblock %}
